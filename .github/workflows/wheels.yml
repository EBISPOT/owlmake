name: Wheels

# Build the native `owlmake` Python extension (crates/owlmake-py, pyo3) as an
# abi3 wheel for every supported platform. Publishing to PyPI is DISABLED for now
# (not published yet — install from the repo with `pip install ./crates/owlmake-py`);
# the publish job below is gated off until we're ready to release.
#
# The extension is built with maturin via PyO3/maturin-action, which runs each
# target in the appropriate manylinux container / cross toolchain. abi3 means one
# wheel per platform works on CPython 3.9+, so there is no per-minor-version
# matrix. An sdist is built too.
#
# Every job runs on an Ubuntu or a Windows runner — no macOS runners (they
# bill at ~10x the Linux rate). The two macOS wheels cross-compile from Linux
# with maturin's `--zig` mode, the same Zig-as-linker approach release.yml uses
# for the `om` binary: abi3 extension modules link against no libpython (macOS
# uses `-undefined dynamic_lookup`), so no Apple SDK or interpreter is needed.
#
# Triggers (both build + upload artifacts only; neither publishes):
#   * push tag `v*`   -> build all wheels + sdist.
#   * manual dispatch -> build all wheels + sdist.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: wheel ${{ matrix.platform }} ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux
            target: x86_64
            manylinux: '2_28'
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:55a36963bc0504cdf004011001c1072306402f0b8b83be5a5eba7068f93eec53
          - runner: ubuntu-26.04
            platform: linux
            target: aarch64
            manylinux: '2_28'
            container: ghcr.io/rust-cross/manylinux_2_28-cross@sha256:ca53fa07ecf1c3e6408c51fbca64c036d9d29af832d3f8bb954910e89097f275
          - { runner: ubuntu-26.04,  platform: macos,   target: x86_64-apple-darwin,  zig: true }
          - { runner: ubuntu-26.04,  platform: macos,   target: aarch64-apple-darwin, zig: true }
          - { runner: windows-2025-vs2026, platform: windows, target: x64 }
          - { runner: windows-2025-vs2026, platform: windows, target: aarch64 }
    # A hung runner must not sit for GitHub's 24-hour default (a stuck macos-13
    # job once billed a full day); the slowest honest build here is ~20 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # maturin-action installs zig itself when `--zig` is in args; this makes
      # the dependency explicit so a change in the action's behaviour fails
      # here, on the install, rather than mid-link.
      - name: Install zig
        if: matrix.zig
        run: pip install ziglang==0.17.1

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        # The darwin cross-links need the same two accommodations as the `om`
        # binary's (see release.yml, whose comments carry the detail): capping
        # MAC_OS_X_VERSION_MIN_REQUIRED selects mimalloc's arc4random_buf path
        # instead of a CommonCrypto #include Zig's SDK-less stubs cannot serve,
        # and `-F .github/macos-stubs` resolves the CoreFoundation link that
        # chrono's clock feature pulls in. Scoped to the darwin entries — unlike
        # release.yml's all-zig matrix, the Windows jobs here link with MSVC,
        # which has no `-F` flag.
        env:
          CFLAGS_x86_64_apple_darwin: -DMAC_OS_X_VERSION_MIN_REQUIRED=101400
          CFLAGS_aarch64_apple_darwin: -DMAC_OS_X_VERSION_MIN_REQUIRED=101400
          RUSTFLAGS: ${{ matrix.zig && format('-C link-arg=-F{0}/.github/macos-stubs', github.workspace) || '' }}
        with:
          # crates/owlmake-py holds the pyproject; the Rust crate it builds
          # depends on the workspace root, so the whole repo is the build context.
          working-directory: crates/owlmake-py
          target: ${{ matrix.target }}
          # manylinux container only applies to the Linux targets; ignored else.
          manylinux: ${{ matrix.manylinux || 'auto' }}
          # The image each Linux wheel is built in, by digest.
          container: ${{ matrix.container || '' }}
          maturin-version: v1.16.0
          rust-toolchain: 1.99.1
          # `--zig` on the darwin targets: cross-link with Zig instead of an
          # Apple toolchain (maturin drives cargo-zigbuild, the same SDK-less
          # link release.yml uses).
          args: --release --locked --out dist ${{ matrix.zig && '--zig' || '' }}
          sccache: 'true'

      # Validate the wheel we can actually run here (native Linux x86_64).
      - name: Smoke-test wheel
        if: matrix.platform == 'linux' && matrix.target == 'x86_64'
        run: |
          python -m pip install pip==26.3
          python -m pip install --no-index --find-links crates/owlmake-py/dist owlmake
          # Run from a clean dir so the installed wheel is imported.
          cd /tmp
          python - <<'PY'
          from owlmake import Ontology
          o = Ontology.parse(b"Prefix(:=<http://x/>)\nOntology(<http://x/o>\nDeclaration(Class(:A))\nDeclaration(Class(:B))\nSubClassOf(:A :B)\n)\n", "ofn")
          o.reason("elk")
          assert ("http://x/A", "http://x/B") in o.subclass_pairs()
          print("wheel OK:", len(o), "components")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wheel-${{ matrix.platform }}-${{ matrix.target }}
          path: crates/owlmake-py/dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          working-directory: crates/owlmake-py
          maturin-version: v1.16.0
          rust-toolchain: 1.99.1
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sdist
          path: crates/owlmake-py/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: [wheels, sdist]
    # Publishing disabled until we're ready to release to PyPI. To re-enable,
    # restore: if: startsWith(github.ref, 'refs/tags/')
    if: false
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      # Trusted publishing (OIDC) — configure a PyPI publisher for this repo +
      # workflow, or replace this job with a token-based `twine upload`.
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: dist
          pattern: 'wheel-*'
          merge-multiple: true
      - name: Download sdist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: sdist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          packages-dir: dist
