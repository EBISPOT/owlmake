name: Docs

# Build auto-generated documentation for all four owlmake interfaces and publish
# them to GitHub Pages as one site:
#   /cli     CLI reference   (generated from `owlmake __cli-spec`)
#   /rust    Rust API        (cargo doc)
#   /python  Python API      (pdoc, from the native extension's docstrings)
#   /js      JS/TS API       (TypeDoc, from the wasm-bindgen .d.ts)
#
# The doc sets come from three jobs that share no build and so run in parallel,
# each uploading its slice of the site; `assemble` merges the slices and adds the
# landing page, and `deploy` publishes the result to GitHub Pages (Source:
# "GitHub Actions"). Everything runs on every push to dev (the project's primary
# branch) and on manual `workflow_dispatch`.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-and-rust:
    name: cli + rust docs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11.18'

      - name: Install tools
        run: python -m pip install -r .github/requirements/cli-docs.txt

      # --- CLI reference: generated from the binary's __cli-spec ---
      # Runs before the Rust docs because it is what creates `site/`.
      - name: CLI docs
        run: |
          cargo build --locked
          python scripts/gen_cli_docs.py
          python scripts/md_to_html.py docs/cli.md site/cli/index.html "owlmake CLI reference"

      # --- Rust API: cargo doc for the workspace crates ---
      - name: Rust docs
        run: |
          cargo doc --locked --no-deps --workspace
          cp -r target/doc site/rust
          # `cargo doc --workspace` documents several crates and so emits no
          # top-level index.html; redirect /rust/ to the main crate's docs so the
          # Pages landing link resolves instead of 404ing.
          test -f site/rust/index.html || \
            printf '<!doctype html><meta http-equiv="refresh" content="0; url=owlmake/index.html">\n' \
              > site/rust/index.html

      - name: Upload slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: docs-cli-rust
          path: site

  python-docs:
    name: python docs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11.18'

      - name: Install tools
        run: python -m pip install -r .github/requirements/python-docs.txt

      # --- Python API: pdoc over the installed native extension ---
      # The wheel is unoptimized: pdoc reads the extension's docstrings and never
      # runs an ontology through it, so the optimized build the shipped wheels get
      # (.github/workflows/wheels.yml) would buy nothing here but compile time.
      - name: Python docs
        run: |
          maturin build --locked --out dist -m crates/owlmake-py/Cargo.toml
          python -m pip install --no-index --find-links dist owlmake
          pdoc -o site/python owlmake

      - name: Upload slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: docs-python
          path: site

  js-docs:
    name: js docs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2

      # A prebuilt wasm-pack, so the job spends its time on owlmake rather than
      # on compiling its build tool.
      - name: Install wasm-pack
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e  # v2
        with:
          tool: wasm-pack@0.15.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20.20.2'

      # TypeDoc and everything it needs, as .github/typedoc/package-lock.json
      # has them.
      - name: Install tools
        run: npm ci --prefix .github/typedoc

      # --- JS/TS API: TypeDoc over the wasm-bindgen .d.ts ---
      - name: JS docs
        working-directory: crates/owlmake-wasm
        run: |
          wasm-pack build --target nodejs --out-dir pkg -- --locked
          "$GITHUB_WORKSPACE/.github/typedoc/node_modules/.bin/typedoc" --out "$GITHUB_WORKSPACE/site/js"

      - name: Upload slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: docs-js
          path: site

  assemble:
    name: assemble site
    needs: [cli-and-rust, python-docs, js-docs]
    runs-on: ubuntu-26.04
    steps:
      # For docs/index.html, the landing page; the doc sets themselves arrive as
      # artifacts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Collect the slices
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: docs-*
          merge-multiple: true
          path: site

      - name: Landing page
        run: cp docs/index.html site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
