name: Docker

# Build the minimal Alpine images (om plus the compatibility PATH shims) for
# amd64 + arm64 and push them to GitHub Container Registry (ghcr.io). Two
# variants come out of the one Dockerfile:
#
#   * default target      -> ghcr.io/<repo>          (om only, ~38 MB)
#   * target with-python  -> ghcr.io/<repo>:*-python (adds Python 3 + Pandas)
#
# Tagging (each applied to both variants, the python one with a `-python` suffix):
#   * tag `v*`        -> pushes :<version>, :<major.minor>, and :latest
#   * manual dispatch -> pushes :edge (for testing)
#
# The image cross-compiles a static musl binary in its builder stage, so both
# arches build on a single cheap Linux runner without emulating the Rust compile.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (default)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Image metadata (with-python)
        id: meta_python
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Same tags as the default image, suffixed so both variants share one
          # package: :latest-python, :1.2-python, :edge-python, …
          flavor: suffix=-python,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push (default)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (with-python)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: with-python
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_python.outputs.tags }}
          labels: ${{ steps.meta_python.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
